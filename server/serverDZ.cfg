// =============================================================================
// serverDZ.cfg - NIMBY | HARDCORE | BADLANDS | 1pp
// -----------------------------------------------------------------------------
// Purpose : Server configuration for Jeff's public hardcore-survival DayZ server
//           on Nasdara (Badlands), hosted at HostHavoc, Chicago.
// Owner   : Jeff Fabish (hosting, config, mods). In-game admin: Jay (Trendkill).
// Record  : Notion hub "DayZ Badlands Server - Project Hub" holds the decisions
//           behind every value below. Change the decision there first.
// Status  : DRAFT v0.1, 2026-10-14. Not yet deployed to any server.
//
// Secrets : password and passwordAdmin stay empty in this file. Set them in the
//           HostHavoc panel only. Never commit a real value here.
// Panel   : HostHavoc may rewrite some lines (hostname, maxPlayers, passwords,
//           ports) from its own panel fields on boot. After the first deploy,
//           diff the live file against this one and record which lines the
//           panel owns in docs/ before relying on this file for those values.
// =============================================================================

// ---- Identity and access ----------------------------------------------------
hostname = "NIMBY | HARDCORE | BADLANDS | 1pp";
password = "";                  // Testing phase: set the join password in the panel. Public launch: empty.
passwordAdmin = "";             // Set in the panel. Never commit.
enableWhitelist = 0;            // Decision: whitelist ruled out.
maxPlayers = 40;                // Decision: 40 slots at public launch.

// ---- Integrity --------------------------------------------------------------
verifySignatures = 2;           // Only supported value. Kicks clients whose PBOs fail .bikey checks.
forceSameBuild = 1;             // Clients must match the server build (1.30 at Badlands release).
allowFilePatching = 0;          // No client file patching on a public server.
BattlEye = 1;

// ---- Hardcore profile (decision: full hardcore, fast nights) -----------------
disable3rdPerson = 1;           // Decision: 1PP only.
disableCrosshair = 1;
disablePersonalLight = 1;       // No ambient light around the player at night.
lightingConfig = 1;             // 1 = darker nights.
enableDebugMonitor = 0;         // No health/blood HUD readout.

// ---- Time ---------------------------------------------------------------------
// Night acceleration combines with serverTimeAcceleration (HostHavoc docs: "a
// multiplier on top of"), so nights run at roughly 16x and days at 4x.
// Estimate: about 40-45 real minutes of darkness per in-game night and about
// three nights per 12-hour restart window. Confirm on the live build.
// Because time persists, a restart can land mid-night; that is accepted.
serverTime = "SystemTime";      // Starting clock for the first boot only; after that the persisted time wins.
serverTimeAcceleration = 4;
serverNightTimeAcceleration = 4;
serverTimePersistent = 1;       // Decision 2026-10-14: the clock carries over restarts; the cycle never resets.

// ---- Voice ------------------------------------------------------------------
disableVoN = 0;
vonCodecQuality = 20;

// ---- Persistence and damage -------------------------------------------------
instanceId = 1;                 // Storage lives in mpmissions/<mission>/storage_1/.
storageAutoFix = 1;             // Replace corrupted persistence files instead of failing boot.
disableBaseDamage = 0;
disableContainerDamage = 0;
disableRespawnDialog = 0;
respawnTime = 5;

// ---- Network and login queue ----------------------------------------------
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;

// ---- Gameplay overrides -----------------------------------------------------
enableCfgGameplayFile = 1;      // Load cfggameplay.json from the mission folder (see server/mission-overrides/).

// ---- Logging (observability) ----------------------------------------------
timeStampFormat = "Full";       // Full timestamps so log lines correlate across RPT, ADM, and script logs.
logAverageFps = 60;             // Seconds between average-FPS log lines.
logMemory = 1;
logPlayers = 1;
logFile = "server_console.log";
adminLogPlayerHitsOnly = 0;     // Log all hits, not only player-on-player, for admin investigations.
adminLogPlacement = 1;
adminLogBuildActions = 1;
adminLogPlayerList = 1;

// ---- Message of the day -----------------------------------------------------
motd[] = {
    "NIMBY | HARDCORE | BADLANDS | 1pp",
    "No PvP or PvE zones. Every encounter is your call."
};
motdInterval = 900;             // Seconds between MOTD lines.

// ---- Mission ----------------------------------------------------------------
class Missions
{
    class DayZ
    {
        // UNVERIFIED until Oct 15: Bohemia has not published the Nasdara mission
        // folder name. Readiness step: list mpmissions/ on the 1.30 server files
        // and set this to the exact, case-sensitive folder name. This value
        // deliberately does not exist, so the server fails to boot rather than
        // loading the wrong map.
        template = "dayzOffline.NASDARA_UNVERIFIED";
    };
};
