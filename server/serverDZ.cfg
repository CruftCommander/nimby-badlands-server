// =============================================================================
// serverDZ.cfg - NIMBY Badlands | Enhanced Vanilla | RP | 1PP
// -----------------------------------------------------------------------------
// Purpose : Server configuration for Jeff's public DayZ server, hosted at
//           HostHavoc, Chicago. Test instance runs Chernarus until Nasdara ships.
// Owner   : Jeff Fabish (hosting, config, mods). In-game admin: Jay (Trendkill).
// Record  : Notion hub "DayZ Badlands Server - Project Hub" holds the decisions
//           behind every value below. Change the decision there first.
// Status  : v0.3, 2026-10-14. Deployed to HostHavoc as serverDZ_By_HostHavoc.cfg.
//
// Deploy  : The panel file is serverDZ_By_HostHavoc.cfg. The server holds a lock
//           on it while running: stop the server, paste, save, start. Take a
//           panel backup first.
// Secrets : password and passwordAdmin stay empty in this file. The live panel
//           file carries the real passwordAdmin; keep that line as-is when you
//           paste this file over it. Never commit a real value here.
// Panel   : Lines marked [panel] came from HostHavoc's default file and are kept
//           so the server stays visible in the browser and DZSA Launcher.
// =============================================================================

// ---- Identity and access ----------------------------------------------------
hostname = "NIMBY Badlands | Enhanced Vanilla | RP | 1PP";
password = "";                  // Decision 2026-10-14: stays open during testing (supersedes the password-protected test phase).
passwordAdmin = "";             // Live value lives in the panel file only. Never commit.
enableWhitelist = 0;            // Decision: whitelist ruled out.
maxPlayers = 40;                // Decision: 40 slots. [panel] Exceeding the paid slot count suspends the service.
maxPing = 200;                  // [panel] Kick above 200 ms.

// ---- Integrity --------------------------------------------------------------
verifySignatures = 2;           // Only supported value. Kicks clients whose PBOs fail .bikey checks.
forceSameBuild = 1;             // Clients must match the server build.
allowFilePatching = 0;          // No client file patching on a public server.
BattlEye = 1;

// ---- Hardcore profile (decision: full hardcore, fast nights) -----------------
disable3rdPerson = 1;           // Decision: 1PP only.
disableCrosshair = 1;
disablePersonalLight = 1;       // No ambient light around the player at night.
lightingConfig = 1;             // 1 = darker nights.
enableDebugMonitor = 0;         // No health/blood HUD readout.

// ---- Time ---------------------------------------------------------------------
// Night acceleration multiplies serverTimeAcceleration, so nights run at roughly
// 16x and days at 4x: about 40-45 real minutes of darkness per in-game night.
// Confirm on the live build. Time persists, so a restart can land mid-night.
serverTime = "SystemTime";      // Starting clock for the first boot only; after that the persisted time wins.
serverTimeAcceleration = 4;
serverNightTimeAcceleration = 4;
serverTimePersistent = 1;       // Decision 2026-10-14: the clock carries over restarts.

// ---- Voice ------------------------------------------------------------------
disableVoN = 0;
vonCodecQuality = 20;           // 0-30. Panel default was 7.

// ---- Persistence and damage -------------------------------------------------
instanceId = 1;                 // Storage lives in mpmissions/<mission>/storage_1/. Changing it starts a fresh world.
lootHistory = 1;                // [panel] Persistence history files kept per instance.
storeHouseStateDisabled = false; // [panel] Keep house and door persistence.
storageAutoFix = 1;             // Replace corrupted persistence files instead of failing boot.
disableBaseDamage = 0;
disableContainerDamage = 0;
disableRespawnDialog = 0;
respawnTime = 5;

// ---- Network and login queue ----------------------------------------------
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
steamQueryPort = 2303;          // [panel] Query port DZSA Launcher and the Steam browser use. Do not change.
steamProtocolMaxDataSize = 4000; // [panel] Room for the mod list in the query reply.

// ---- Gameplay overrides -----------------------------------------------------
enableCfgGameplayFile = 1;      // Load cfggameplay.json from the mission folder.

// ---- Logging (observability) ----------------------------------------------
timeStampFormat = "Full";       // Full timestamps so RPT, ADM, and script logs correlate.
logAverageFps = 60;             // Seconds between average-FPS log lines.
logMemory = 60;                 // Seconds between memory log lines (1 floods the RPT; see docs/baselines).
logPlayers = 60;                // Seconds between player-count log lines.
logFile = "server_console.log";
adminLogPlayerHitsOnly = 0;     // Log all hits, not only player-on-player, for admin investigations.
adminLogPlacement = 1;
adminLogBuildActions = 1;
adminLogPlayerList = 1;

// ---- Messages ---------------------------------------------------------------
// Join and hourly messages live in the mission's db/messages.xml
// (repo: server/mission-overrides/db/messages.xml). The cfg MOTD stays empty
// so players do not get the same text twice.
motd[] = {};
motdInterval = 900;

// ---- Mission ----------------------------------------------------------------
class Missions
{
    class DayZ
    {
        // Test instance: Chernarus until the 1.30 server files ship Nasdara.
        // Readiness step: list mpmissions/ on the 1.30 files, set the exact,
        // case-sensitive Nasdara folder name here, and copy
        // server/mission-overrides/db/messages.xml into that mission's db/.
        template = "dayzOffline.chernarusplus";
    };
};
