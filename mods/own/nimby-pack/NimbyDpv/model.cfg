// -----------------------------------------------------------------------------
// NimbyDpv - model.cfg for dpv.p3d and dpvwheel.p3d (Phase 1).
// Bones: one damper bone per wheel (translation along <wheel>_damper_axis, driven by the
// config AnimationSources damper_1_1 .. damper_2_2 that CarScript's wheel sim sets, phase 0 =
// full down, 1 = full up), a steering bone on the front wheels (rotation about
// <wheel>_steering_axis, driven by the engine's animTurn sources turnfrontleft / turnfrontright),
// and the wheel bone that carries the proxy triangle. The steering wheel rotates about
// axis_drivewheel from the engine's steeringwheel source; wheels spin from wheelfrontleft etc. Selections and memory points are
// written by scripts/dpv/build_nimbydpv_model.py; the names match the vanilla ADA
// (vendor/dayz-1.30-vehicles/offroadhatchback.p3d.names.txt).
// -----------------------------------------------------------------------------
class CfgSkeletons
{
    class Default
    {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
    class Vehicle : Default {};
    class dpv_skeleton : Vehicle
    {
        isDiscrete = 1;
        skeletonInherit = "Vehicle";
        skeletonBones[] =
        {
            "drivewheel", "",
            "wheel_1_1_damper", "",
            "wheel_1_1_steering", "wheel_1_1_damper",
            "wheel_1_1", "wheel_1_1_steering",
            "wheel_2_1_damper", "",
            "wheel_2_1_steering", "wheel_2_1_damper",
            "wheel_2_1", "wheel_2_1_steering",
            "wheel_1_2_damper", "",
            "wheel_1_2", "wheel_1_2_damper",
            "wheel_2_2_damper", "",
            "wheel_2_2", "wheel_2_2_damper",
            "wheel_spare_1", "",
            // crew proxies need a bone of the same name or the engine seats the player at the
            // model origin (Diag 2026-11-05 20:58: root=<0,0,0> in car space)
            "crewdriver", "",
            "crewcodriver", "",
            "crewcargo1", "",
            "reflector_1_1", "",
            "reflector_2_1", "",
            "battery", "",
            "radiator", "",
            "sparkplug", "",
            // rail storage proxies (build 45, November 7, 2026): an attachment proxy in a selection
            // that is not a bone is never placed; builds 40 to 44 logged the attached items at
            // the car origin, as the crew did before their bones above
            "rail_1", "",
            "rail_2", "",
            "rail_3", "",
            "rail_4", "",
            // build 53: the backpack twin of each rail slot (config Slot_NimbyDpvRailBag_N)
            "railbag_1", "",
            "railbag_2", "",
            "railbag_3", "",
            "railbag_4", ""
        };
    };
    class dpvwheel_skeleton : Default
    {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
};

class CfgModels
{
    class Default
    {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    class Vehicle : Default
    {
        sections[] = {};
    };
    class dpv : Vehicle
    {
        skeletonName = "dpv_skeleton";
        sectionsInherit = "Vehicle";
        sections[] =
        {
            "light_left", "light_right",
            "dmgzone_chassis", "dmgzone_front", "dmgzone_back", "dmgzone_engine", "dmgzone_fueltank", "dmgzone_roof",
            "dmgzone_fender_1_1", "dmgzone_fender_1_2", "dmgzone_fender_2_1", "dmgzone_fender_2_2",
            "dmgzone_lights_1_1", "dmgzone_lights_2_1"
        };
        class Animations
        {
            // steeringwheel is the DayZ engine source for the steering wheel (the Arma name
            // drivingWheel logs "unknown animation source" on 1.30)
            class drivewheel
            {
                type = "rotation";
                source = "steeringwheel";
                selection = "drivewheel";
                axis = "axis_drivewheel";
                memory = 1;
                minValue = -1;
                maxValue = 1;
                angle0 = "rad 90";
                angle1 = "rad -90";
            };
            // suspension: config AnimationSources damper_x_y, phase 0 at full compression down
            class damper_1_1
            {
                type = "translation";
                source = "damper_1_1";
                selection = "wheel_1_1_damper";
                axis = "wheel_1_1_damper_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                offset0 = -0.11;   // = -travelMaxDown (front), build 25
                offset1 = 0.12;    // = travelMaxUp (front)
            };
            class damper_2_1 : damper_1_1
            {
                source = "damper_2_1";
                selection = "wheel_2_1_damper";
                axis = "wheel_2_1_damper_axis";
            };
            class damper_1_2 : damper_1_1
            {
                source = "damper_1_2";
                selection = "wheel_1_2_damper";
                axis = "wheel_1_2_damper_axis";
                offset0 = -0.11;   // = -travelMaxDown (rear), build 25
                offset1 = 0.13;    // = travelMaxUp (rear)
            };
            class damper_2_2 : damper_1_2
            {
                source = "damper_2_2";
                selection = "wheel_2_2_damper";
                axis = "wheel_2_2_damper_axis";
            };
            // steering: engine animTurn sources named in the config Axles block
            // source = the animTurn name itself; source = "user" makes the engine look for a config
            // AnimationSources entry and log "Animation source turnfrontleft not found"
            class turnfrontleft
            {
                type = "rotation";
                source = "turnfrontleft";
                selection = "wheel_1_1_steering";
                axis = "wheel_1_1_steering_axis";
                memory = 1;
                minValue = -1;
                maxValue = 1;
                angle0 = "rad -35";
                angle1 = "rad 35";
            };
            class turnfrontright : turnfrontleft
            {
                source = "turnfrontright";
                selection = "wheel_2_1_steering";
                axis = "wheel_2_1_steering_axis";
            };
            // wheel spin: engine animRotation sources (CarScript defaults wheelfrontleft,
            // wheelfrontright, wheelbackleft, wheelbackright), looping 0..1 = one turn about
            // <wheel>_axis (memory points at x-0.3 and x+0.3 of the hub, left to right)
            class wheelfrontleft
            {
                type = "rotation";
                source = "wheelfrontleft";
                sourceAddress = "loop";
                selection = "wheel_1_1";
                axis = "wheel_1_1_axis";
                memory = 1;
                minValue = 0;
                maxValue = 1;
                angle0 = 0;
                angle1 = "rad 360";
            };
            class wheelfrontright : wheelfrontleft
            {
                source = "wheelfrontright";
                selection = "wheel_2_1";
                axis = "wheel_2_1_axis";
            };
            class wheelbackleft : wheelfrontleft
            {
                source = "wheelbackleft";
                selection = "wheel_1_2";
                axis = "wheel_1_2_axis";
            };
            class wheelbackright : wheelfrontleft
            {
                source = "wheelbackright";
                selection = "wheel_2_2";
                axis = "wheel_2_2_axis";
            };
        };
    };
    class dpvwheel : Default
    {
        skeletonName = "dpvwheel_skeleton";
        sections[] = {};
    };
};
