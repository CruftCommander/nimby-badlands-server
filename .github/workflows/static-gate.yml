# Static gate for the NIMBY tooling and pack (ruled by Jeff, October 21, 2026: a hosted static CI
# gate now, a self-hosted boot-check runner later).
#
# Runs on GitHub's windows-latest runner under both Windows PowerShell 5.1 and PowerShell 7:
#   - pester: the Pester 5 suite in scripts\tests (verdict functions, PBO packer, BERCon, Steam
#     lookup, replica copy guards, join-password sources).
#   - static: scripts\Test-NimbyRepo.ps1 (secrets, em dashes, double ampersands, CfgMods coverage
#     and NOTICE per addon, unsigned PBO pack of every addon, CRLF per .gitattributes).
# No step needs Steam, DayZ Server, DayZ Tools, the signing key, or any secret. The boot check
# (a real DayZ server) is not here; it needs the self-hosted runner.

name: static-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pester is saved to a fixed folder and cached between runs, so most runs skip PowerShell
      # Gallery; a cache miss retries the download, which failed once under 5.1 (run #20,
      # October 27, 2026: "Package 'Pester' failed to download") and took 2 min 45 s on PR #2.
      - name: Restore Pester 5.9.1
        id: pester-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/pester-5.9.1
          key: pester-5.9.1-${{ runner.os }}-${{ matrix.shell }}

      - name: Install Pester 5.9.1
        if: steps.pester-cache.outputs.cache-hit != 'true'
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $target = Join-Path $HOME 'pester-5.9.1'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                  if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue)) {
                      Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force -ErrorAction Stop | Out-Null
                  }
                  Save-Module -Name Pester -RequiredVersion 5.9.1 -Repository PSGallery -Path $target -Force -ErrorAction Stop
                  break
              }
              catch {
                  if ($attempt -eq 3) { throw }
                  Write-Warning ("Pester download attempt {0} of 3 failed: {1}. Retrying in 15 s." -f $attempt, $_.Exception.Message)
                  Start-Sleep -Seconds 15
              }
          }

      - name: Run Pester
        run: |
          Import-Module (Join-Path $HOME 'pester-5.9.1\Pester\5.9.1\Pester.psd1') -Force
          "PowerShell $($PSVersionTable.PSVersion), Pester $((Get-Module Pester).Version)"
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  static:
    name: Static checks (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Test-NimbyRepo.ps1
        run: |
          & .\scripts\Test-NimbyRepo.ps1
          exit $LASTEXITCODE
